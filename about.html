  <script src="js/main.js?v=20260526"></script>
  <script>
    // ---- Load About Page Content from API ----
    async function loadAboutContent() {
      try {
        const response = await fetch('/api/about');
        const result = await response.json();
        
        if (result.success) {
          renderAboutContent(result.data);
        } else {
          showAboutError('加载失败：' + (result.message || '未知错误'));
        }
      } catch (e) {
        console.error('加载关于我们页面失败:', e);
        showAboutError('网络请求失败，请刷新页面重试');
      }
    }

    function renderAboutContent(data) {
      const container = document.getElementById('about-content');
      if (!container) return;

      const sectionNames = {
        'platform_intro': '平台介绍',
        'service_mission': '服务宗旨',
        'coverage': '信息覆盖范围',
        'disclaimer': '免责声明',
        'contact': '联系我们'
      };

      let html = '';

      // Platform Introduction
      if (data.platform_intro) {
        html += `
          <div class="about-section">
            <h2 class="about-section__title">${escapeHtml(data.platform_intro.title)}</h2>
            <div class="about-section__text">
              ${formatContent(data.platform_intro.content)}
            </div>
          </div>
        `;
      }

      // Service Mission
      if (data.service_mission) {
        html += `
          <div class="about-section">
            <h2 class="about-section__title">${escapeHtml(data.service_mission.title)}</h2>
            <div class="about-section__text">
              ${formatContent(data.service_mission.content)}
            </div>
          </div>
        `;
      }

      // Coverage
      if (data.coverage) {
        html += `
          <div class="about-section">
            <h2 class="about-section__title">${escapeHtml(data.coverage.title)}</h2>
            <div class="about-section__text">
              ${formatContent(data.coverage.content)}
            </div>
          </div>
        `;
      }

      // Disclaimer
      if (data.disclaimer) {
        html += `
          <div class="about-section">
            <h2 class="about-section__title">${escapeHtml(data.disclaimer.title)}</h2>
            <div class="about-section__text">
              ${formatContent(data.disclaimer.content)}
            </div>
          </div>
        `;
      }

      // Contact
      if (data.contact) {
        html += `
          <div class="about-section">
            <h2 class="about-section__title">${escapeHtml(data.contact.title)}</h2>
            <div class="about-section__text">
              ${formatContactContent(data.contact.content)}
            </div>
          </div>
        `;
      }

      container.innerHTML = html;
    }

    function formatContent(text) {
      if (!text) return '';
      // 支持换行符转换为 <p> 标签
      return text.split('\n').filter(line => line.trim()).map(line => {
        if (line.trim().startsWith('-')) {
          return '<p>' + escapeHtml(line.trim().substring(1).trim()) + '</p>';
        }
        return '<p>' + escapeHtml(line) + '</p>';
      }).join('');
    }

    function formatContactContent(text) {
      if (!text) return '';
      
      const lines = text.split('\n').filter(line => line.trim());
      let html = '<div style="display: grid; gap: var(--space-4);">';
      
      lines.forEach(line => {
        if (line.includes('邮箱') || line.includes('@')) {
          const email = line.match(/[\w@.]+/)?.[0] || '';
          html += `
            <div style="display: flex; align-items: flex-start; gap: var(--space-4); padding: var(--space-5); background: var(--color-bg); border-radius: var(--radius-lg);">
              <div style="width:40px;height:40px;background:var(--color-accent-light);border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--color-accent);">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                </div>
                <div>
                  <div style="font-weight:var(--font-weight-semibold);margin-bottom:var(--space-1);">电子邮箱</div>
                  <div style="color:var(--color-text-secondary);font-size:var(--font-size-sm);">${escapeHtml(email)}</div>
                </div>
              </div>
          `;
        } else if (line.includes('官方') || line.includes('www')) {
          const url = line.match(/[\w.:/]+/)?.[0] || '';
          html += `
            <div style="display: flex; align-items: flex-start; gap: var(--space-4); padding: var(--space-5); background: var(--color-bg); border-radius: var(--radius-lg);">
              <div style="width:40px;height:40px;background:var(--color-accent-light);border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--color-accent);">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
                </div>
                <div>
                  <div style="font-weight:var(--font-weight-semibold);margin-bottom:var(--space-1);">官方网站</div>
                  <div style="color:var(--color-text-secondary);font-size:var(--font-size-sm);">${escapeHtml(url)}</div>
                </div>
              </div>
          `;
        } else if (line.includes('微信') || line.includes('iTechNice')) {
          html += `
            <div style="display: flex; align-items: flex-start; gap: var(--space-4); padding: var(--space-5); background: var(--color-bg); border-radius: var(--radius-lg);">
              <div style="width:40px;height:40px;background:rgba(7,193,96,0.12);border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#07c160;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                </div>
                <div>
                  <div style="font-weight:var(--font-weight-semibold);margin-bottom:var(--space-1);">合作联系</div>
                  <div style="color:var(--color-text-secondary);font-size:var(--font-size-sm);">微信账号：<span style="color:var(--color-accent);font-weight:var(--font-weight-semibold);">iTechNice</span></div>
                </div>
              </div>
          `;
        }
      });

      html += '</div>';
      return html;
    }

    function showAboutError(message) {
      const container = document.getElementById('about-content');
      if (container) {
        container.innerHTML = `
          <div style="text-align:center;padding:var(--space-16);color:var(--color-error);">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="width:48px;height:48px;margin-bottom:var(--space-4);opacity:0.4;"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
            <p>${escapeHtml(message)}</p>
          </div>
        `;
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // Initialize
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', loadAboutContent);
    } else {
      loadAboutContent();
    }
  </script>
