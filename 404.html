<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="页面不存在 - 安徽招考网">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%233182CE'/><text x='50' y='72' text-anchor='middle' fill='white' font-size='55' font-weight='bold' font-family='sans-serif'>皖</text></svg>">
  <title>404 页面不存在 - 安徽招考网</title>
  <link rel="stylesheet" href="/css/style.css?v=20260526">
  <style>
    .not-found {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - var(--header-height) - 200px);
      text-align: center;
      padding: var(--space-8);
    }
    .not-found__code {
      font-size: 120px;
      font-weight: 900;
      color: var(--color-accent);
      line-height: 1;
      margin-bottom: var(--space-2);
      opacity: 0.15;
    }
    .not-found__title {
      font-size: var(--font-size-2xl);
      font-weight: var(--font-weight-bold);
      color: var(--color-text);
      margin-bottom: var(--space-3);
      margin-top: -60px;
    }
    .not-found__desc {
      font-size: var(--font-size-base);
      color: var(--color-text-secondary);
      margin-bottom: var(--space-8);
      max-width: 400px;
    }
    .not-found__actions {
      display: flex;
      gap: var(--space-4);
      flex-wrap: wrap;
      justify-content: center;
    }
    .not-found__btn {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      padding: var(--space-3) var(--space-6);
      border-radius: var(--radius-md);
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-medium);
      text-decoration: none;
      transition: all var(--transition-fast);
    }
    .not-found__btn--primary {
      background: var(--color-accent);
      color: #fff;
    }
    .not-found__btn--primary:hover {
      opacity: 0.9;
    }
    .not-found__btn--secondary {
      background: var(--color-surface);
      color: var(--color-text-secondary);
      border: 1px solid var(--color-border);
    }
    .not-found__btn--secondary:hover {
      border-color: var(--color-accent);
      color: var(--color-accent);
    }
    .not-found__btn svg {
      width: 16px;
      height: 16px;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a href="/" class="site-logo">
        <div class="site-logo__icon">皖</div>
        <span>安徽招考网</span>
      </a>
    </div>
  </header>

  <main>
    <div class="not-found">
      <div class="not-found__code">404</div>
      <h1 class="not-found__title">页面不存在</h1>
      <p class="not-found__desc">您访问的页面可能已被删除、更名或暂时不可用。请检查网址是否正确，或返回首页继续浏览。</p>
      <div class="not-found__actions">
        <a href="/" class="not-found__btn not-found__btn--primary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
          返回首页
        </a>
        <a href="/list.html" class="not-found__btn not-found__btn--secondary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
          全部公告
        </a>
      </div>
    </div>
  </main>
</body>
</html>
