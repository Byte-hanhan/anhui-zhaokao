<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="安徽招考网 - 用户登录 / 注册">
  <title>登录 / 注册 - 安徽招考网</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* ---- Auth Page Specific Styles ---- */
    .auth-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .auth-main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-10) var(--space-4);
      background: linear-gradient(135deg, #EBF4FF 0%, #F7FAFC 50%, #EDF2F7 100%);
      transition: background var(--transition-normal);
    }

    [data-theme="dark"] .auth-main {
      background: linear-gradient(135deg, #1A202C 0%, #2D3748 50%, #1A202C 100%);
    }

    .auth-card {
      width: 100%;
      max-width: 440px;
      background: var(--color-surface);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-xl);
      padding: var(--space-10) var(--space-10);
      border: 1px solid var(--color-border-light);
      transition: background var(--transition-normal);
    }

    .auth-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-3);
      margin-bottom: var(--space-8);
      text-decoration: none;
      color: var(--color-text);
    }

    .auth-logo__icon {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, var(--color-accent), #4299E1);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: var(--font-size-lg);
      font-weight: var(--font-weight-bold);
    }

    .auth-logo__name {
      font-size: var(--font-size-xl);
      font-weight: var(--font-weight-bold);
    }

    /* Tab Switch */
    .auth-tabs {
      display: flex;
      background: var(--color-bg);
      border-radius: var(--radius-lg);
      padding: var(--space-1);
      margin-bottom: var(--space-8);
    }

    .auth-tab {
      flex: 1;
      padding: var(--space-3) var(--space-4);
      border-radius: var(--radius-md);
      text-align: center;
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-semibold);
      color: var(--color-text-secondary);
      cursor: pointer;
      transition: all var(--transition-normal);
      border: none;
      background: transparent;
    }

    .auth-tab.active {
      background: var(--color-surface);
      color: var(--color-accent);
      box-shadow: var(--shadow-sm);
    }

    /* Form */
    .auth-panel {
      display: none;
    }

    .auth-panel.active {
      display: block;
    }

    .auth-field {
      margin-bottom: var(--space-5);
    }

    .auth-label {
      display: block;
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-semibold);
      color: var(--color-text);
      margin-bottom: var(--space-2);
    }

    .auth-label .required {
      color: var(--color-error);
      margin-left: 2px;
    }

    .auth-input-wrap {
      position: relative;
    }

    .auth-input-wrap svg {
      position: absolute;
      left: var(--space-4);
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      color: var(--color-text-muted);
      pointer-events: none;
    }

    .auth-input {
      width: 100%;
      padding: var(--space-3) var(--space-4) var(--space-3) calc(var(--space-4) + 18px + var(--space-3));
      border: 1.5px solid var(--color-border);
      border-radius: var(--radius-md);
      background: var(--color-bg);
      color: var(--color-text);
      font-size: var(--font-size-sm);
      transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
    }

    .auth-input:focus {
      border-color: var(--color-accent);
      box-shadow: 0 0 0 3px var(--color-accent-light);
      outline: none;
    }

    .auth-input.error {
      border-color: var(--color-error);
      box-shadow: 0 0 0 3px rgba(229,62,62,0.1);
    }

    .auth-input-error {
      display: none;
      font-size: var(--font-size-xs);
      color: var(--color-error);
      margin-top: var(--space-1);
    }

    .auth-input-error.show {
      display: block;
    }

    .auth-btn {
      width: 100%;
      padding: var(--space-4);
      border-radius: var(--radius-md);
      background: var(--color-accent);
      color: #fff;
      font-size: var(--font-size-base);
      font-weight: var(--font-weight-semibold);
      cursor: pointer;
      border: none;
      transition: background var(--transition-fast), transform var(--transition-fast);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
      margin-top: var(--space-6);
    }

    .auth-btn:hover {
      background: var(--color-accent-hover);
    }

    .auth-btn:active {
      transform: scale(0.98);
    }

    .auth-btn .btn-spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .auth-btn.loading .btn-text { display: none; }
    .auth-btn.loading .btn-spinner { display: block; }

    .auth-divider {
      display: flex;
      align-items: center;
      gap: var(--space-4);
      margin: var(--space-6) 0;
    }

    .auth-divider::before,
    .auth-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--color-border);
    }

    .auth-divider span {
      font-size: var(--font-size-xs);
      color: var(--color-text-muted);
      white-space: nowrap;
    }

    .auth-footer-note {
      text-align: center;
      font-size: var(--font-size-xs);
      color: var(--color-text-muted);
      margin-top: var(--space-6);
      line-height: var(--line-height-relaxed);
    }

    .auth-footer-note a {
      color: var(--color-accent);
    }

    /* Success Banner */
    .auth-success {
      display: none;
      text-align: center;
      padding: var(--space-8);
    }

    .auth-success.show {
      display: block;
    }

    .auth-success__icon {
      width: 72px;
      height: 72px;
      background: rgba(72,187,120,0.12);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto var(--space-5);
      color: var(--color-success);
    }

    .auth-success__icon svg {
      width: 36px;
      height: 36px;
    }

    .auth-success__title {
      font-size: var(--font-size-lg);
      font-weight: var(--font-weight-bold);
      color: var(--color-text);
      margin-bottom: var(--space-2);
    }

    .auth-success__desc {
      font-size: var(--font-size-sm);
      color: var(--color-text-secondary);
      margin-bottom: var(--space-6);
    }

    /* User avatar in header */
    .user-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--color-accent);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-bold);
      cursor: pointer;
      border: 2px solid var(--color-border);
      transition: border-color var(--transition-fast);
      text-decoration: none;
    }

    .user-avatar:hover {
      border-color: var(--color-accent);
      color: #fff;
    }

    @media (max-width: 767px) {
      .auth-card {
        padding: var(--space-8) var(--space-6);
        border-radius: var(--radius-lg);
      }
    }
  </style>
</head>

  <script>
    // ---- Auth Logic (API版) ----
    const SESSION_KEY = 'ahzk_session';
    const API_BASE = '/api';

    async function apiCall(path, body) {
      try {
        const resp = await fetch(API_BASE + path, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json; charset=utf-8' },
          body: JSON.stringify(body)
        });
        return await resp.json();
      } catch (e) {
        return { success: false, message: '网络请求失败，请稍后重试' };
      }
    }

    function setSession(user, token) {
      localStorage.setItem(SESSION_KEY, JSON.stringify(user));
      if (token) localStorage.setItem('ahzk_token', token);
    }

    function switchPanel(panel) {
      document.querySelectorAll('.auth-tab').forEach(t => t.classList.toggle('active', t.dataset.panel === panel));
      document.querySelectorAll('.auth-panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + panel));
      clearErrors();
    }

    function clearErrors() {
      document.querySelectorAll('.auth-input-error').forEach(el => { el.textContent = ''; el.classList.remove('show'); });
      document.querySelectorAll('.auth-input').forEach(el => el.classList.remove('error'));
    }

    function showError(fieldId, msg) {
      const errEl = document.getElementById(fieldId + '-err');
      const inputEl = document.getElementById(fieldId);
      if (errEl) { errEl.textContent = msg; errEl.classList.add('show'); }
      if (inputEl) inputEl.classList.add('error');
    }

    function showGlobalError(panelPrefix, msg) {
      const el = document.getElementById(panelPrefix + '-global-err');
      if (el) { el.textContent = msg; el.classList.add('show'); }
    }

    function showSuccess(title, desc) {
      document.getElementById('auth-tabs').style.display = 'none';
      document.querySelectorAll('.auth-panel').forEach(p => p.style.display = 'none');
      document.getElementById('success-title').textContent = title;
      document.getElementById('success-desc').textContent = desc;
      document.getElementById('auth-success').classList.add('show');
    }

    async function handleLogin(e) {
      e.preventDefault();
      clearErrors();
      const username = document.getElementById('login-username').value.trim();
      const password = document.getElementById('login-password').value;

      let valid = true;
      if (!username) { showError('login-username', '请输入账号'); valid = false; }
      if (!password) { showError('login-password', '请输入密码'); valid = false; }
      if (!valid) return;

      const btn = document.getElementById('login-btn');
      btn.classList.add('loading');

      const result = await apiCall('/auth/login', { username, password });
      btn.classList.remove('loading');

      if (result.success) {
        setSession(result.user, result.token);
        if (result.user.role === 'admin') {
          showSuccess('登录成功！', '欢迎回来，正在跳转到管理后台...');
          setTimeout(() => { window.location.href = 'admin.html'; }, 1200);
        } else {
          showSuccess('登录成功！', '欢迎回来，' + (result.user.nickname || result.user.username) + '！正在跳转...');
          setTimeout(() => { window.location.href = 'index.html'; }, 1200);
        }
      } else {
        showGlobalError('login', result.message || '账号或密码错误，请重试');
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      clearErrors();

      const nickname = document.getElementById('reg-nickname').value.trim();
      const username = document.getElementById('reg-username').value.trim();
      const password = document.getElementById('reg-password').value;
      const password2 = document.getElementById('reg-password2').value;

      let valid = true;
      if (!nickname || nickname.length < 2 || nickname.length > 12) { showError('reg-nickname', '昵称需为 2-12 个字符'); valid = false; }
      if (!username || username.length < 4 || username.length > 20) { showError('reg-username', '账号需为 4-20 位字母或数字'); valid = false; }
      if (!/^[a-zA-Z0-9_]+$/.test(username)) { showError('reg-username', '账号只能包含字母、数字和下划线'); valid = false; }
      if (!password || password.length < 6) { showError('reg-password', '密码至少 6 位'); valid = false; }
      if (password !== password2) { showError('reg-password2', '两次输入的密码不一致'); valid = false; }
      if (!valid) return;

      const btn = document.getElementById('register-btn');
      btn.classList.add('loading');

      const result = await apiCall('/auth/register', { username, nickname, password });
      btn.classList.remove('loading');

      if (result.success) {
        setSession(result.user, result.token);
        showSuccess('注册成功！', '欢迎加入，' + (result.user.nickname || result.user.username) + '！正在跳转到首页...');
        setTimeout(() => { window.location.href = 'index.html'; }, 1500);
      } else {
        if (result.message && result.message.includes('已存在')) {
          showError('reg-username', result.message);
        } else {
          showGlobalError('reg', result.message || '注册失败，请重试');
        }
      }
    }

    // Auto switch to register tab if URL param present
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('mode') === 'register') {
      switchPanel('register');
    }

    // Redirect if already logged in
    const session = (() => { try { return JSON.parse(localStorage.getItem('ahzk_session')); } catch(e) { return null; } })();
    if (session) {
      window.location.href = session.role === 'admin' ? 'admin.html' : 'index.html';
    }

    // ---- 微信扫码登录 ----
    var _wxPollTimer = null;
    window.showWxQrLogin = async function() {
      var modal = document.getElementById('wx-login-modal');
      if (!modal) return;
      modal.style.display = 'flex';
      modal.style.alignItems = 'center';
      modal.style.justifyContent = 'center';
      document.getElementById('wx-qr-msg').textContent = '正在生成二维码...';
      try {
        var genResp = await fetch(API_BASE + '/auth/qrcode-login/generate');
        var gen = await genResp.json();
        if (!gen.success) { document.getElementById('wx-qr-msg').textContent = '生成失败'; return; }
        document.getElementById('wx-qr-img').src = '/api/auth/qrcode-login/qr?code=' + gen.code;
        document.getElementById('wx-qr-msg').textContent = '请使用微信扫描二维码';
        _wxPollTimer = setInterval(async function() {
          try {
            var resp = await fetch('/api/auth/qrcode-login/check?code=' + gen.code);
            var check = await resp.json();
            if (check.success) {
              clearInterval(_wxPollTimer);
              modal.style.display = 'none';
              localStorage.setItem('ahzk_token', check.token);
              localStorage.setItem('ahzk_session', JSON.stringify(check.user));
              location.reload();
            }
          } catch(e) {}
        }, 1500);
        setTimeout(function() { clearInterval(_wxPollTimer); }, 180000);
      } catch(e) {
        document.getElementById('wx-qr-msg').textContent = '网络错误';
      }
    };

    // apiCall 的 GET 变体
    async function getApi(path) {
      try {
        var resp = await fetch('/api' + path);
        return await resp.json();
      } catch(e) { return { success: false }; }
    }
  </script>
</body>
</html>
